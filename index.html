<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIDIRECTIONAL WARDEN CALC — V3</title>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-card: #181b21;
            --bg-input: #22262e;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-orange: #ff9d00;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #2d3440;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 540px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .origin-toggle {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            cursor: pointer;
            display: inline-block;
            margin-bottom: 12px;
            user-select: none;
        }

        .origin-inputs {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border: 1px dashed var(--border);
        }

        .origin-inputs.show {
            display: block;
        }

        .results-card {
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 0, 0.05);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-green);
            font-family: monospace;
        }

        .pulse-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .pulse-card {
            background: var(--bg-input);
            padding: 14px;
            border-radius: 6px;
            text-align: center;
            border-left: 3px solid var(--accent-cyan);
        }

        .pulse-card.z-axis {
            border-left-color: var(--accent-orange);
        }

        .pulse-card span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .pulse-card strong {
            font-size: 1.6rem;
            color: #fff;
            font-family: monospace;
        }

        .sim-section {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .sim-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .sim-data {
            font-size: 0.95rem;
            font-family: monospace;
            color: #fff;
        }

        .sim-error {
            font-size: 0.8rem;
            color: var(--accent-orange);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="header">
        <h1>Omnidirectional Warden Calc</h1>
        <p>Warden Cannon V3 — 2-Point Calibration Matrix</p>
    </div>

    <div class="input-group">
        <div class="input-row">
            <div>
                <label for="targetX">Target X</label>
                <input type="number" id="targetX" value="2500" step="any">
            </div>
            <div>
                <label for="targetZ">Target Z</label>
                <input type="number" id="targetZ" value="2000" step="any">
            </div>
        </div>
    </div>

    <span class="origin-toggle" onclick="toggleOrigin()">⚙️ Toggle Launch Origin</span>
    <div class="origin-inputs" id="originBox">
        <div class="input-row">
            <div>
                <label for="originX">Origin X</label>
                <input type="number" id="originX" value="1503" step="any">
            </div>
            <div>
                <label for="originZ">Origin Z</label>
                <input type="number" id="originZ" value="1503" step="any">
            </div>
        </div>
    </div>

    <div class="results-card">
        <div class="pulse-box">
            <div class="pulse-card">
                <span>X Lectern Pulses</span>
                <strong id="outPx">0</strong>
            </div>
            <div class="pulse-card z-axis">
                <span>Z Lectern Pulses</span>
                <strong id="outPz">0</strong>
            </div>
        </div>

        <div class="result-row">
            <span class="result-label">Firing Timer (3 pulses/s)</span>
            <span class="result-value" id="outTimer">0 ticks (0.0s)</span>
        </div>

        <div class="sim-section">
            <div class="sim-title">Impact Simulator (After Rounding & +1 Ghost Pulse)</div>
            <div class="sim-data" id="simCoords">Est. Landing: [0.0, 0.0]</div>
            <div class="sim-error" id="simError">Drift Error: 0.00 blocks</div>
        </div>
    </div>
</div>

<script>
    // 2-Point Matrix Constants (Derived from [576, 261] and [284, 488])
    // Forward coefficients (Pulses -> Blocks)
    const C_XX = 2.66474;
    const C_XZ = -0.87900;
    const C_ZX = -0.71795;
    const C_ZZ = 2.14195;

    // Invert Matrix Coefficients (Blocks -> Pulses)
    const I_XX = 0.4219219;
    const I_XZ = 0.1731456;
    const I_ZX = 0.1414219;
    const I_ZZ = 0.5249012;

    const inputs = ['targetX', 'targetZ', 'originX', 'originZ'];
    inputs.forEach(id => document.getElementById(id).addEventListener('input', calculate));

    function toggleOrigin() {
        document.getElementById('originBox').classList.toggle('show');
    }

    function calculate() {
        const tX = parseFloat(document.getElementById('targetX').value) || 0;
        const tZ = parseFloat(document.getElementById('targetZ').value) || 0;
        const oX = parseFloat(document.getElementById('originX').value) || 0;
        const oZ = parseFloat(document.getElementById('originZ').value) || 0;

        // 1. Calculate displacement from origin
        const dx = tX - oX;
        const dz = tZ - oZ;

        // 2. Solve for effective pulses required (including +1 ghost pulse)
        const effX = (I_XX * dx) + (I_XZ * dz);
        const effZ = (I_ZX * dx) + (I_ZZ * dz);

        // 3. Subtract 1 for the ghost pulse and round to integer lectern pages
        const pX = Math.max(0, Math.round(effX) - 1);
        const pZ = Math.max(0, Math.round(effZ) - 1);

        document.getElementById('outPx').innerText = pX;
        document.getElementById('outPz').innerText = pZ;

        // 4. Timer Calculation (3 pulses per second = 6.667 ticks per unit)
        const totalPulses = pX + pZ;
        const durationTicks = Math.floor(totalPulses * (20 / 3));
        const durationSec = (totalPulses / 3).toFixed(1);
        document.getElementById('outTimer').innerText = `${durationTicks} ticks (${durationSec}s)`;

        // 5. Impact Simulator (Forward calculation using integer pulses + 1 ghost pulse)
        const simDx = C_XX * (pX + 1) + C_XZ * (pZ + 1);
        const simDz = C_ZX * (pX + 1) + C_ZZ * (pZ + 1);
        const landX = oX + simDx;
        const landZ = oZ + simDz;

        // Calculate landing error distance
        const errX = tX - landX;
        const errZ = tZ - landZ;
        const totalErr = Math.sqrt(errX * errX + errZ * errZ);

        document.getElementById('simCoords').innerText = 
            `Est. Landing: [${landX.toFixed(1)}, ${landZ.toFixed(1)}]`;
        document.getElementById('simError').innerText = 
            `Rounding Drift Error: ±${totalErr.toFixed(2)} blocks`;
    }

    // Run initial calculation on page load
    calculate();
</script>
</body>
</html>
