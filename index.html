<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Warden Cannon V3 Calculator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #ff4d4d;
        color: #000;
        font-family: 'Comic Sans MS', 'Fredoka One', 'Chalkboard SE', 'Comic Neue', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 15px;
    }

    .calculator {
        width: 100%;
        max-width: 600px;
    }

    h1 {
        margin-bottom: 8px;
        color: #ffffff;
        text-align: center;
        font-size: 2.4rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-shadow: 
            3px 3px 0 #000, 
            -1px -1px 0 #000, 
            1px -1px 0 #000, 
            -1px 1px 0 #000, 
            1px 1px 0 #000;
    }

    .subtitle {
        color: #ffffff;
        font-weight: 900;
        text-align: center;
        margin-bottom: 35px;
        font-size: 1.3rem;
        text-shadow: 2px 2px 0 #000;
    }

    .card {
        background: #ffffff;
        border: 4px solid #000;
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 8px 8px 0px #000;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: translateY(-4px) translateX(-4px);
        box-shadow: 12px 12px 0px #000;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 4px dashed #ff4d4d;
        padding-bottom: 12px;
        margin-bottom: 20px;
    }

    .card h2 {
        margin: 0;
        color: #ff4d4d;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 1px 1px 0px #000;
        font-size: 1.6rem;
    }

    .quadrant-badge {
        background: #ffb3b3;
        color: #000;
        border: 3px solid #000;
        padding: 5px 12px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 900;
        box-shadow: 2px 2px 0px #000;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    label {
        display: block;
        color: #000;
        font-weight: 900;
        margin-bottom: 8px;
        font-size: 16px;
        text-transform: uppercase;
    }

    input {
        width: 100%;
        padding: 14px;
        background: #fff;
        color: #000;
        border: 3px solid #000;
        border-radius: 12px;
        font-size: 20px;
        font-weight: bold;
        font-family: inherit;
        box-shadow: 4px 4px 0px #ff4d4d;
        transition: all 0.1s ease;
        text-align: center;
    }

    input:focus {
        outline: none;
        transform: translateY(2px) translateX(2px);
        box-shadow: 2px 2px 0px #ff4d4d;
    }

    .result {
        font-size: 42px;
        font-weight: 900;
        color: #ff4d4d;
        text-shadow: 2px 2px 0px #000;
        text-align: center;
    }

    .good {
        color: #ffffff;
        background: #ff4d4d;
        text-shadow: 2px 2px 0px #000;
        box-shadow: 4px 4px 0px #000;
        border: 3px solid #000;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-size: 24px;
        letter-spacing: 1px;
    }

    @media (max-width: 600px) {
        .grid {
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .card-header {
            flex-direction: column;
            gap: 10px;
        }
        h1 {
            font-size: 1.8rem;
        }
    }
</style>
</head>

<body>

<div class="calculator">

    <h1>Orbital Warden Cannon V3 Calculator</h1>

    <div class="subtitle">
        for your warden cannon needs
    </div>

    <!-- =========================================================
         COORDINATES
         ========================================================= -->

    <div class="card">
        <div class="card-header">
            <h2>Coordinates</h2>
        </div>

        <div class="grid">
            <div>
                <label>Origin X</label>
                <input id="originX" type="number" value="5999">
            </div>
            <div>
                <label>Origin Z</label>
                <input id="originZ" type="number" value="5999">
            </div>
            <div>
                <label>Target X</label>
                <input id="targetX" type="number" value="7000">
            </div>
            <div>
                <label>Target Z</label>
                <input id="targetZ" type="number" value="7000">
            </div>
        </div>
    </div>

    <!-- =========================================================
         SETTINGS: PULSES & LANDING
         ========================================================= -->

    <div class="card">
        <div class="card-header">
            <h2>Settings</h2>
            <div class="quadrant-badge" id="quadrantBadge">AUTO</div>
        </div>

        <div class="grid" style="margin-bottom: 25px;">
            <div>
                <label style="text-align: center;">X Pulses</label>
                <div class="result" id="xPulses">—</div>
            </div>
            <div>
                <label style="text-align: center;">Z Pulses</label>
                <div class="result" id="zPulses">—</div>
            </div>
        </div>

        <div class="grid">
            <div>
                <label style="text-align: center; margin-bottom: 12px;">Predicted Landing</label>
                <div class="good" id="landing">[0, 0]</div>
            </div>
            <div>
                <label style="text-align: center; margin-bottom: 12px;">Est. Time</label>
                <div class="good" id="eta">0s</div>
            </div>
        </div>
    </div>

</div>

<script>

/*
===========================================================
TIMING CONSTANTS
===========================================================
*/
const PULSES_PER_SECOND = 3.5; // Average of "3 or 4"
const SECONDS_PER_PULSE = 1 / PULSES_PER_SECOND;
const BASE_FLIGHT_SECONDS = 10; // Estimated air-time of the warden

/*
===========================================================
RAW MOTION PER 2 PULSES
===========================================================
*/
const RAW_VECTORS = {
    posX: { x:  3.689 / 2, z: -1.1495 / 2 },
    posZ: { x: -1.270 / 2, z:  3.997 / 2 },
    negX: { x: -4.831 / 2, z: -0.011 / 2 },
    negZ: { x: -0.011 / 2, z: -4.831 / 2 }
};

/*
===========================================================
CALIBRATION CONSTANTS
===========================================================
*/
const PP_CALIBRATION = { xPulse: 0.9806, zPulse: 0.8276 };
const PN_CALIBRATION = { xPulse: 0.9771, zPulse: 0.9121 };
const NP_CALIBRATION = { xPulse: 0.8949, zPulse: 0.8357 };
const NN_CALIBRATION = { xPulse: 0.9019, zPulse: 0.8976 };

/*
===========================================================
BUILD QUADRANT MATRIX
===========================================================
*/
function getMatrix(quadrant) {
    let xVector, zVector;

    switch (quadrant) {
        case "pp":
            xVector = { x: RAW_VECTORS.posX.x * PP_CALIBRATION.xPulse, z: RAW_VECTORS.posX.z * PP_CALIBRATION.xPulse };
            zVector = { x: RAW_VECTORS.posZ.x * PP_CALIBRATION.zPulse, z: RAW_VECTORS.posZ.z * PP_CALIBRATION.zPulse };
            break;
        case "pn":
            xVector = { x: RAW_VECTORS.posX.x * PN_CALIBRATION.xPulse, z: RAW_VECTORS.posX.z * PN_CALIBRATION.xPulse };
            zVector = { x: RAW_VECTORS.negZ.x * PN_CALIBRATION.zPulse, z: RAW_VECTORS.negZ.z * PN_CALIBRATION.zPulse };
            break;
        case "np":
            xVector = { x: RAW_VECTORS.negX.x * NP_CALIBRATION.xPulse, z: RAW_VECTORS.negX.z * NP_CALIBRATION.xPulse };
            zVector = { x: RAW_VECTORS.posZ.x * NP_CALIBRATION.zPulse, z: RAW_VECTORS.posZ.z * NP_CALIBRATION.zPulse };
            break;
        case "nn":
            xVector = { x: RAW_VECTORS.negX.x * NN_CALIBRATION.xPulse, z: RAW_VECTORS.negX.z * NN_CALIBRATION.xPulse };
            zVector = { x: RAW_VECTORS.negZ.x * NN_CALIBRATION.zPulse, z: RAW_VECTORS.negZ.z * NN_CALIBRATION.zPulse };
            break;
    }

    return { a: xVector.x, b: zVector.x, c: xVector.z, d: zVector.z };
}

/*
===========================================================
2x2 MATRIX SOLVER
===========================================================
*/
function solveMatrix(a, b, c, d, deltaX, deltaZ) {
    const determinant = (a * d) - (b * c);
    if (Math.abs(determinant) < 1e-12) return null;

    const xPulses = ((deltaX * d) - (b * deltaZ)) / determinant;
    const zPulses = ((a * deltaZ) - (deltaX * c)) / determinant;

    return { x: xPulses, z: zPulses };
}

/*
===========================================================
CALCULATE
===========================================================
*/
function calculate() {
    const originX = parseFloat(document.getElementById("originX").value) || 0;
    const originZ = parseFloat(document.getElementById("originZ").value) || 0;
    const targetX = parseFloat(document.getElementById("targetX").value) || 0;
    const targetZ = parseFloat(document.getElementById("targetZ").value) || 0;

    const deltaX = targetX - originX;
    const deltaZ = targetZ - originZ;

    // AUTO-DETECT QUADRANT
    let quadrant = "pp";
    let badgeText = "PP (+X / +Z)";

    if (deltaX >= 0 && deltaZ >= 0) {
        quadrant = "pp";
        badgeText = "PP (+X / +Z)";
    } else if (deltaX >= 0 && deltaZ < 0) {
        quadrant = "pn";
        badgeText = "PN (+X / -Z)";
    } else if (deltaX < 0 && deltaZ >= 0) {
        quadrant = "np";
        badgeText = "NP (-X / +Z)";
    } else if (deltaX < 0 && deltaZ < 0) {
        quadrant = "nn";
        badgeText = "NN (-X / -Z)";
    }

    document.getElementById("quadrantBadge").textContent = badgeText;

    const matrix = getMatrix(quadrant);
    const solution = solveMatrix(matrix.a, matrix.b, matrix.c, matrix.d, deltaX, deltaZ);

    if (!solution) {
        document.getElementById("xPulses").textContent = "ERR";
        document.getElementById("zPulses").textContent = "ERR";
        document.getElementById("landing").textContent = "[ERROR]";
        document.getElementById("eta").textContent = "ERR";
        return;
    }

    // ROUND UP PULSES (FORCE POSITIVE)
    const finalX = Math.ceil(Math.abs(solution.x));
    const finalZ = Math.ceil(Math.abs(solution.z));

    document.getElementById("xPulses").textContent = finalX;
    document.getElementById("zPulses").textContent = finalZ;

    // PREDICTED LANDING
    const predictedX = (matrix.a * solution.x) + (matrix.b * solution.z);
    const predictedZ = (matrix.c * solution.x) + (matrix.d * solution.z);
    
    const landingX = originX + predictedX;
    const landingZ = originZ + predictedZ;

    document.getElementById("landing").textContent = 
        `[${landingX.toFixed(1)}, ${landingZ.toFixed(1)}]`;

    // ESTIMATED TIME CALCULATION
    const maxPulses = Math.max(finalX, finalZ);
    const dispenseTime = maxPulses * SECONDS_PER_PULSE;
    const totalTime = dispenseTime + BASE_FLIGHT_SECONDS;

    // Format into minutes and seconds
    const minutes = Math.floor(totalTime / 60);
    const seconds = (totalTime % 60).toFixed(1);
    
    if (minutes > 0) {
        document.getElementById("eta").textContent = `~${minutes}m ${seconds}s`;
    } else {
        document.getElementById("eta").textContent = `~${seconds}s`;
    }
}

/*
===========================================================
LIVE UPDATES
===========================================================
*/
["originX", "originZ", "targetX", "targetZ"].forEach(id => {
    document.getElementById(id).addEventListener("input", calculate);
});

/*
===========================================================
INITIAL CALCULATION
===========================================================
*/
calculate();

</script>

</body>
</html>
